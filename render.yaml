databases:
  - name: mentorship-db
    databaseName: mentorship_db
    user: mentorship_user

services:
  - type: web
    name: mentorship-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mentorship-db
          property: connectionString
      - key: NODE_ENV
        value: production